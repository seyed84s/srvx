name: Build SRVX APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

# ============================================================
#  Pick the libv2ray (Xray core) version here. Must be compatible
#  with v2rayNG 2.2.3 AND still allow VLESS without TLS.
#  Tags: https://github.com/2dust/AndroidLibXrayLite/tags
# ============================================================
env:
  LIBV2RAY_TAG: 'v26.6.1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # The uploaded repo has EMPTY submodule folders (zip upload drops
    # submodule contents), so clone them explicitly here.
    - name: Clone submodules manually
      run: |
        rm -rf hev-socks5-tunnel AndroidLibXrayLite
        git clone --depth 1 --recursive https://github.com/heiher/hev-socks5-tunnel hev-socks5-tunnel
        git clone --depth 1 https://github.com/2dust/AndroidLibXrayLite AndroidLibXrayLite

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;29.0.14206865"
        echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
        sed -i '10i\
        \
            ndkVersion = "29.0.14206865"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

    - name: Build libhevtun
      run: |
        bash compile-hevtun.sh

    - name: Copy libhevtun
      run: |
        cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

    - name: Download libv2ray (pinned)
      uses: robinraju/release-downloader@v1.13
      with:
        repository: '2dust/AndroidLibXrayLite'
        tag: ${{ env.LIBV2RAY_TAG }}
        fileName: 'libv2ray.aar'
        out-file-path: V2rayNG/app/libs/

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        gradle-version: '9.5.1'

    - name: Build debug APK
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        # gradle-wrapper.jar is gitignored (*.jar) so it may be missing from the
        # uploaded repo; use the system gradle installed above instead of ./gradlew
        gradle assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: ${{ success() }}
      with:
        name: srvx-apk
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/**/*.apk
        if-no-files-found: error
